<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live-Stream</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Camera is mounted upside down on the ceiling */
            transform: rotate(180deg);
        }

        #controls {
            position: fixed;
            right: 16px;
            bottom: 16px;
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 12px;
            border: 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        #status {
            position: fixed;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            padding: 0 16px;
            text-align: center;
            font-size: 1.25rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
<!-- No native controls, they would be rotated together with the video -->
<video id="video" muted autoplay playsinline></video>
<div id="status">Verbinde …</div>
<div id="controls">
    <button id="sound" type="button">Ton an</button>
    <button id="fullscreen" type="button">Vollbild</button>
</div>

<script src="hls.min.js"></script>
<script>
    // Stream key from the URL (?stream=<key>), defaults to "elw"
    const streamKey = new URLSearchParams(location.search).get('stream') || 'elw';
    const source = 'hls/' + encodeURIComponent(streamKey) + '/index.m3u8';
    const retryDelay = 3000;

    const video = document.getElementById('video');
    const status = document.getElementById('status');
    let hls = null;
    let retryTimer = null;

    function showOffline() {
        status.textContent = 'Kein Live-Stream aktiv';
        status.hidden = false;
    }

    function scheduleRetry() {
        showOffline();
        if (hls) {
            hls.destroy();
            hls = null;
        }
        clearTimeout(retryTimer);
        retryTimer = setTimeout(start, retryDelay);
    }

    function startHlsJs() {
        hls = new Hls({liveSyncDurationCount: 3});
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                scheduleRetry();
            }
        });
        hls.loadSource(source);
        hls.attachMedia(video);
    }

    function start() {
        if (window.Hls && Hls.isSupported()) {
            startHlsJs();
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari on iOS has no MSE, but plays HLS natively
            video.src = source;
            video.load();
        } else {
            status.textContent = 'Dieser Browser kann den Stream nicht abspielen';
            return;
        }
        video.play().catch(function () {
            // Autoplay can be blocked, the sound button also starts playback
        });
    }

    document.getElementById('sound').addEventListener('click', function () {
        video.muted = !video.muted;
        this.textContent = video.muted ? 'Ton an' : 'Ton aus';
        video.play().catch(function () {
        });
    });

    // Fullscreen uses the page, so the rotation stays active (not available on iPhone)
    const fullscreenButton = document.getElementById('fullscreen');
    fullscreenButton.hidden = !document.documentElement.requestFullscreen;
    fullscreenButton.addEventListener('click', function () {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else {
            document.documentElement.requestFullscreen();
        }
    });

    video.addEventListener('playing', function () {
        status.hidden = true;
    });
    video.addEventListener('ended', scheduleRetry);
    video.addEventListener('error', function () {
        if (!hls) {
            scheduleRetry();
        }
    });

    start();
</script>
</body>
</html>

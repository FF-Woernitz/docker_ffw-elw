# Loads the RTMP module installed by the nginx-mod-rtmp package
include /etc/nginx/modules/*.conf;

user nginx;
# nginx-rtmp shares live streams inside a single worker only
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

rtmp {
    access_log /dev/stdout;

    server {
        listen 1935;
        chunk_size 4096;

        # Publish to rtmp://<host>:1935/live/<stream-key>
        application live {
            live on;

            # Only clients from this subnet may publish
            allow publish 10.2.101.0/24;
            deny publish all;

            # Players use the HLS output, direct RTMP playback is not needed
            allow play 127.0.0.1;
            deny play all;

            # Recording, one file per publish
            record all;
            record_path /recordings;
            record_suffix -%Y-%m-%d_%H-%M-%S.flv;
            exec_record_done /usr/local/bin/flv2mp4.sh $path;

            # Live output for the website
            hls on;
            hls_path /var/hls;
            hls_nested on;
            hls_fragment 2s;
            hls_playlist_length 30s;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    server {
        listen 80;

        root /var/www/rtmp;
        index index.html;

        location /hls/ {
            alias /var/hls/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-store;
        }
    }
}
